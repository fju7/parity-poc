[pytest]
markers =
    eval: live model-drift eval that calls the deployed API (on-demand; excluded from default/CI runs)
    integration: hits the live BASE_URL / Supabase over the network (excluded from default/CI runs)
# Default/CI runs skip live-eval AND integration tests; run them explicitly with `-m eval` or `-m integration`.
addopts = -m "not eval and not integration"
