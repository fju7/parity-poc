[pytest]
markers =
    eval: live model-drift eval that calls the deployed API (on-demand; excluded from default/CI runs)
    integration: hits the live BASE_URL / Supabase over the network (excluded from default/CI runs)
    rehearsal: the WHU orchestrator's full offline rehearsal, minutes per plan, $0 (on demand: `-m rehearsal`)
# Default/CI runs skip live-eval, integration and rehearsal tests; run them explicitly with `-m eval`,
# `-m integration` or `-m rehearsal`.
addopts = -m "not eval and not integration and not rehearsal"
