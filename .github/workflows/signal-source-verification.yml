# Does every source point at a document that exists?
#
# WHY THIS EXISTS, AND WHY IT IS SEPARATE FROM THE GOLDEN SET
# ----------------------------------------------------------
# The golden set watches whether the MODEL's judgment moves. This watches
# whether the CORPUS is real. On 2026-08-31 the second question had never been
# asked, and the answer was that 380 of 381 sources had never had their content
# fetched: `content_text` held a model-written summary, median 473 characters,
# and every claim in Signal was extracted from those summaries rather than from
# the documents they name. 41% of DOIs pointed at nothing or at a different
# paper.
#
# collect_sources.py already called the CrossRef endpoint this check calls. For
# a fabricated DOI it returned nothing, printed "No content fetched, using
# summary", substituted the model's own text and stored the row. The capability
# existed and the failure was advisory.
#
# So this job exists to make it not advisory. It is deterministic -- no model,
# no API key, no drift, nothing to re-measure -- and it fails.
#
# WHAT FAILS IT (changed 2026-10-19). Until then it failed on every draft row
# every week -- red regardless of anything that happened, which is how a
# control stops being read. It now fails only for what reaches a reader: a
# PUBLISHED topic whose publish record is missing, holds a surviving source
# with no held document, or no longer matches the corpus. Draft topics are not
# served (anon reads published topics only; db-posture enforces it daily), so
# their uncitable rows are reported in full but do not fail. This is not an
# allowlist: nothing is exempted by name, and a draft becomes citable only by
# going through publish_topic.py, the gate that made the published topic so.

name: Signal source verification

on:
  schedule:
    # Mondays 12:30 UTC, half an hour before the golden set — if the corpus is
    # not real, the golden set's answer about it does not mean much.
    - cron: "30 12 * * 1"
  push:
    branches: [main]
    paths:
      - "backend/scripts/signal/verify_sources.py"
      - "backend/scripts/signal/collect_sources.py"
      - "backend/scripts/signal/00_discover_sources.py"
      - "backend/scripts/signal/extract_claims.py"
  workflow_dispatch:
    inputs:
      slug:
        description: "Check one topic only (blank = all)"
        required: false
        type: string
      offline:
        description: "Provenance only — no network, runs in seconds"
        required: false
        type: boolean
        default: false

concurrency:
  group: signal-source-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt

      - name: Verify sources
        id: verify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: backend
        run: |
          set -o pipefail
          ARGS=""
          [ -n "${{ inputs.slug }}" ] && ARGS="$ARGS --slug ${{ inputs.slug }}"
          [ "${{ inputs.offline }}" = "true" ] && ARGS="$ARGS --offline"
          python scripts/signal/verify_sources.py $ARGS --json /tmp/sources.json 2>&1 \
            | tee /tmp/verify.log

      - name: Report to the run summary
        if: always()
        run: |
          OUTCOME=$(grep -o 'SOURCES_OUTCOME=[a-z_]*' /tmp/verify.log 2>/dev/null | tail -1 | cut -d= -f2)
          {
            echo "## Signal source verification"
            echo ""
            case "$OUTCOME" in
              clean)
                echo "Every source resolves to the document it names." ;;
              drafts_only)
                echo "**Passed.** Every published topic's sources are covered by its publish"
                echo "record. Draft topics still hold uncitable sources (listed below); they"
                echo "are not served and stay unpublishable until rebuilt through"
                echo "\`publish_topic.py\`." ;;
              published_problem)
                echo "**A published topic's sources are not covered by its publish record.**"
                echo "Re-run the publish gate or unpublish the topic. Details below." ;;
              *)
                echo "**The check did not finish** (no outcome line in the log). Read the log below." ;;
            esac
            echo ""
            echo '```'
            tail -45 /tmp/verify.log 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the full result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: source-verification
          path: |
            /tmp/verify.log
            /tmp/sources.json
          retention-days: 90
