# Detects when a Signal consensus judgment changes.
#
# WHY THIS RUNS IN CI RATHER THAN AS A CRON ENDPOINT
# --------------------------------------------------
# This is a regression test, and tests belong where tests live. A Render
# endpoint would also have to survive 52 sequential model calls inside one HTTP
# request, would couple the pipeline scripts into the web app, and would need a
# results table to report through. Here the run IS the report: a drift fails the
# job, and GitHub already knows how to tell Fred that. Since 2026-10-19 only an
# UNDECIDED drift fails it; drifts with a recorded decision are reported, not failed.
#
# WHAT IT PROTECTS
# ----------------
# GLP-1 'pricing' was published as "debated" from March to August 2026. The
# model behind the claude-sonnet-4-6 alias had started calling it "consensus" —
# correctly. Nothing noticed for five months; it surfaced by accident.
#
# No dated snapshot is published for that model family (checked 2026-08-26), so
# drift cannot be prevented by pinning. Detection is the whole control, and a
# control is worth only as much as its frequency.
#
# TWO TRIGGERS, AND THE SECOND MATTERS MORE
# -----------------------------------------
# Weekly puts the worst-case detection window at seven days instead of five
# months. But the push trigger catches the more common cause: an edit to the
# prompt or the scoring scripts. That is checked at the moment it is made,
# which is the only moment anyone still remembers why they made it.

name: Signal golden set

on:
  schedule:
    # Mondays 13:00 UTC (~9am ET).
    - cron: "0 13 * * 1"
  push:
    branches: [main]
    paths:
      # Only the files that can actually move a judgment. The diagnostics are
      # excluded so that editing a measuring tool does not spend 52 calls.
      - "backend/scripts/signal/map_consensus.py"
      - "backend/scripts/signal/signal_model.py"
      - "backend/scripts/signal/score_claims.py"
      - "backend/scripts/signal/classify_claims.py"
      - "backend/scripts/signal/extract_claims.py"
      - "backend/scripts/signal/topic_config.py"
      - "backend/tests/fixtures/signal_consensus_golden.json"
  workflow_dispatch:
    inputs:
      slug:
        description: "Check one topic only (blank = all nine)"
        required: false
        type: string

# A newer commit supersedes an in-flight check; no point paying twice.
concurrency:
  group: signal-golden-set-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pinned, not ubuntu-latest. ubuntu-latest moves to Ubuntu 26.04 between
    # 2026-10-19 and 2026-11-19, and the 26.04 image pre-caches only Python
    # 3.14 -- 3.11 (what Render runs) is not on it. Move deliberately, after a
    # test run on ubuntu-26.04, not because a label changed underneath us.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      # Node 24 majors. v4/v5/v4 targeted Node 20, which GitHub is removing
      # from hosted runners (deprecation warning on every run since Sept).
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        # Install what production installs. An earlier version hand-picked just
        # anthropic and supabase to save ~30s, which duplicated the version
        # constraints — so pinning requirements.txt did nothing here and CI kept
        # resolving anthropic 1.0.0, whose Messages.create() dropped
        # `temperature`. requirements.txt cannot serve as a pip constraints file
        # either (uvicorn[standard] has extras, which pip rejects there).
        # One source of truth is worth the half minute.
        run: pip install -r backend/requirements.txt

      - name: Run golden set
        id: golden
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Set the SIGNAL_MODEL repository variable if a snapshot ever becomes
          # pinnable; otherwise the script's own default applies.
          SIGNAL_MODEL: ${{ vars.SIGNAL_MODEL }}
        working-directory: backend
        run: |
          set -o pipefail
          ARGS=""
          if [ -n "${{ inputs.slug }}" ]; then
            ARGS="--slug ${{ inputs.slug }}"
          fi
          python scripts/signal/golden_set.py $ARGS 2>&1 | tee /tmp/golden.log

      - name: Report to the run summary
        # always(), so the summary is written on failure too — which is the
        # case anyone actually opens.
        if: always()
        run: |
          OUTCOME=$(grep -o 'GOLDEN_OUTCOME=[a-z_]*' /tmp/golden.log 2>/dev/null | tail -1 | cut -d= -f2)
          {
            echo "## Signal golden set"
            echo ""
            case "$OUTCOME" in
              clean)
                echo "All categories measured. No published judgment moved." ;;
              known_only)
                echo "**Passed.** Every drift in this run already has a recorded decision in"
                echo "\`signal_golden_decisions.json\`; warnings are listed below for reading."
                echo "Nothing new to decide." ;;
              new_drift)
                echo "**A judgment moved and nobody has decided about it yet.** This is not"
                echo "automatically a regression -- three of the five drifts in the original"
                echo "sweep were the model improving. Read the claims in the affected category,"
                echo "then record a decision in \`signal_golden_decisions.json\` (or re-baseline"
                echo "with \`golden_set.py --record\` and say why in the commit)." ;;
              site_mismatch)
                echo "**The live page disagrees with the baseline** and the difference is not in"
                echo "\`published_exceptions\`. Re-map the category or record why it is deliberate." ;;
              unmeasured)
                echo "**Some categories could not be measured.** This run proves nothing about them."
                echo "Fix the cause and re-run." ;;
              unbaselined)
                echo "**Some categories have no baseline.** Add them with \`golden_set.py --record\`." ;;
              *)
                echo "**The check did not finish** (no outcome line in the log). Read the log below." ;;
            esac
            echo ""
            echo '```'
            tail -80 /tmp/golden.log 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the full log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: golden-set-log
          path: /tmp/golden.log
          retention-days: 30
