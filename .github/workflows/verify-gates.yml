# The verification gates: resolve / fetch / bind, both registries.
#
# TWO JOBS, TWO QUESTIONS
# -----------------------
# `offline` asks whether the CODE still does what the golden sets say, replaying
# the 90 registry responses recorded 2026-09-14. It installs poppler-utils so
# the CMS manual and NCCI adapters are exercised, not skipped: a skip that
# always fires is an untested adapter.
#
# `live` asks whether the WORLD still agrees with the recording. Fixtures
# freeze; the eCFR revises, Ohio amends, CMS reissues its manuals annually,
# Europe PMC adds full texts. Monthly, the same golden sets run against the
# live registries with the cache bypassed, and any divergence between live and
# recorded fails the job. The run is the report; GitHub tells the operator.
#
# WHY GITHUB ACTIONS AND NOT A RENDER CRON
# ----------------------------------------
# This repository's scheduled checks live here (signal-golden-set.yml,
# signal-source-verification.yml) for the reason their headers give: a
# regression test belongs where tests live, needs no results table, and fails
# where a person is already told. The script is a plain CLI; if a Render cron
# is wanted instead, `python backend/scripts/verify_live_registries.py` is the
# whole start command.

name: Verification gates

on:
  schedule:
    # Monthly live-registry diff: first Monday-ish, 11:00 UTC -- after the
    # eCFR's first-of-month text exists, before the Signal checks at 12:30.
    - cron: "0 11 1-7 * 1"
    # Weekly status re-check of every published topic (the fifth check):
    # Mondays 12:00 UTC. Retraction is the rarest, highest-impact event;
    # registries propagate within days; one metadata call per source.
    - cron: "0 12 * * 1"
    # Monthly binding re-check: re-fetch and re-bind every recorded binding.
    # The floor under the weekly check; every-week re-fetch of every PDF is
    # how a check becomes noise. Same first-Monday slot, an hour later.
    - cron: "0 13 1-7 * 1"
  push:
    branches: [main]
    paths:
      - "backend/verify/**"
      - "backend/tests/verify/**"
      - "backend/utils/citation_gate.py"
      - "backend/tests/test_citation_gate.py"
      - "backend/scripts/verify_live_registries.py"
      - ".github/workflows/verify-gates.yml"
  workflow_dispatch:
    inputs:
      only:
        description: "Live run: one registry only (literature | law); blank = both"
        required: false
        type: string
      recheck:
        description: "Re-check published topics now: status | bindings; blank = neither"
        required: false
        type: string

concurrency:
  group: verify-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      first: ${{ steps.first.outputs.line }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: pdftotext, so the manual adapters run rather than skip
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils && pdftotext -v 2>&1 | head -1
      - run: pip install -r backend/requirements.txt pytest
      - name: Golden sets against the recording
        working-directory: backend
        env:
           SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
           SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
           VERIFY_OFFLINE: "1"   # a missing recording fails by name; never a live fetch
        run: |
          set -o pipefail
          python -m pytest tests/verify tests/test_citation_gate.py -q -s -rs 2>&1 | tee /tmp/offline.log
      - name: No manual entry may have been skipped
        working-directory: backend
        run: |
          if grep -q "SKIPPED" /tmp/offline.log; then
            echo "SKIPPED: a golden-set entry was skipped; the adapter it exercises is untested" >> /tmp/offline.log
            echo "::error::a golden-set entry was skipped; the adapter it exercises is untested"; exit 1
          fi
      - name: First failure line, for the gate's issue
        id: first
        if: always()
        run: |
          line=$(grep -m1 -E "^(FAILED|ERROR) |RecordingMissing|^SKIPPED:" /tmp/offline.log 2>/dev/null || true)
          echo "line=${line:0:300}" >> "$GITHUB_OUTPUT"

  live:
    # Monthly and on demand only: a push should not hit five registries.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      first: ${{ steps.first.outputs.line }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - run: pip install -r backend/requirements.txt
      - name: Live registries vs the 2026-09-14 recording
        id: live
        working-directory: backend
        run: |
          set -o pipefail
          ARGS=""
          [ -n "${{ inputs.only }}" ] && ARGS="--only ${{ inputs.only }}"
          python scripts/verify_live_registries.py $ARGS 2>&1 | tee /tmp/live.log
      - name: Report to the run summary
        if: always()
        run: |
          {
            echo "## Verification gates — live registries vs recording"
            echo ""
            if [ "${{ steps.live.outcome }}" = "success" ]; then
              echo "Every golden-set entry resolves, fetches and binds live exactly as recorded."
            else
              echo "**Live registries have diverged from the recording.** Not necessarily an error —"
              echo "the eCFR revises, Ohio amends, CMS reissues — but the fixtures no longer hold the"
              echo "world. Read the divergence, re-record, and re-read the heading before trusting it."
            fi
            echo ""; echo '```'; tail -60 /tmp/live.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: First divergence line, for the gate's issue
        id: first
        if: always()
        run: |
          line=$(grep -m1 -E "DIVERGED|Traceback|Error" /tmp/live.log 2>/dev/null | sed -E 's/ +/ /g' || true)
          echo "line=${line:0:300}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Published topics against their frozen records (Phase 3 §2, §3). Weekly the
  # status check; monthly the full binding re-check. Any binding_lost or
  # status_changed fails the job -- the run is the report -- and the same flags
  # are written to topic_rechecks, which is what the page renders markers from.
  # A re-check never edits the record and never flips status.
  # ---------------------------------------------------------------------------
  recheck-status:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 12 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.recheck == 'status')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      first: ${{ steps.first.outputs.line }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - name: Status re-check, every published topic
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        # pipefail: without it the step's status was tee's, and an ALERT
        # (recheck_topic.py exits 1) could never fail the job.
        run: |
          set -o pipefail
          python scripts/recheck_topic.py --all --kind status 2>&1 | tee /tmp/recheck-status.log
      - name: First alert line, for the gate's issue
        id: first
        if: always()
        run: |
          line=$(grep -m1 -E " -> ALERT;|Traceback|Error" /tmp/recheck-status.log 2>/dev/null || true)
          echo "line=${line:0:300}" >> "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: recheck-status
          path: |
            /tmp/recheck-status.log
            backend/data/verify/rechecks/
          retention-days: 400

  recheck-bindings:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 13 1-7 * 1') || (github.event_name == 'workflow_dispatch' && inputs.recheck == 'bindings')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      first: ${{ steps.first.outputs.line }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - run: pip install -r backend/requirements.txt
      - name: Binding re-check, every published topic
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        # pipefail: without it the step's status was tee's, and an ALERT
        # (recheck_topic.py exits 1) could never fail the job.
        run: |
          set -o pipefail
          python scripts/recheck_topic.py --all --kind bindings 2>&1 | tee /tmp/recheck-bindings.log
      - name: First alert line, for the gate's issue
        id: first
        if: always()
        run: |
          line=$(grep -m1 -E " -> ALERT;|Traceback|Error" /tmp/recheck-bindings.log 2>/dev/null || true)
          echo "line=${line:0:300}" >> "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: recheck-bindings
          path: |
            /tmp/recheck-bindings.log
            backend/data/verify/rechecks/
          retention-days: 400

  # ---------------------------------------------------------------------------
  # Surfacing: one GitHub issue per gate. A failed gate opens its issue (label
  # verification-gate) or comments on the open one; the gate's next SUCCESS
  # closes it. Skipped or cancelled says nothing about the gate and touches
  # nothing. Added 2026-11-02 after `live` failed from 10-26 to 11-02 with
  # nobody acting: a red run notifies once and scrolls away, an open issue
  # stays open until the gate is green.
  # Log lines reach the issue through env and --body-file, never through ${{ }}
  # inside the script.
  # ---------------------------------------------------------------------------
  surface:
    needs: [offline, live, recheck-status, recheck-bindings]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read
    steps:
      - name: Open, update or close one issue per gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          R_offline: ${{ needs.offline.result }}
          F_offline: ${{ needs.offline.outputs.first }}
          R_live: ${{ needs.live.result }}
          F_live: ${{ needs.live.outputs.first }}
          R_recheck_status: ${{ needs.recheck-status.result }}
          F_recheck_status: ${{ needs.recheck-status.outputs.first }}
          R_recheck_bindings: ${{ needs.recheck-bindings.result }}
          F_recheck_bindings: ${{ needs.recheck-bindings.outputs.first }}
        run: |
          set -euo pipefail
          gh label create verification-gate --color B60205 \
            --description "A Verification gates job is failing; closes itself on the gate's next green run" --force >/dev/null
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" --paginate > /tmp/jobs.json
          for gate in offline live recheck-status recheck-bindings; do
            v=${gate//-/_}; r="R_$v"; f="F_$v"; result=${!r}; first=${!f:-}
            title="Verification gate failing: $gate"
            num=$(gh issue list --label verification-gate --state open --limit 50 --json number,title \
                  --jq ".[] | select(.title == \"$title\") | .number" | head -1)
            case "$result" in
              failure)
                step=$(jq -r --arg g "$gate" '[.jobs[] | select(.name == $g) | .steps[] | select(.conclusion == "failure") | .name] | join(", ")' /tmp/jobs.json)
                {
                  echo "**$gate** failed in run $RUN_URL ($EVENT, ${SHA:0:7}, $(date -u +%Y-%m-%dT%H:%MZ))."
                  echo ""
                  echo "- Failing step: ${step:-unknown}"
                  echo "- First failure line:"
                  echo '```'; echo "${first:-(none captured; read the run log)}"; echo '```'
                } > /tmp/body.md
                if [ -n "$num" ]; then
                  gh issue comment "$num" --body-file /tmp/body.md
                  echo "$gate: failure -> commented on #$num"
                else
                  { echo "This issue closes itself when the **$gate** gate next passes."; echo ""; cat /tmp/body.md; } > /tmp/new.md
                  gh issue create --title "$title" --label verification-gate --body-file /tmp/new.md
                  echo "$gate: failure -> opened"
                fi ;;
              success)
                if [ -n "$num" ]; then
                  gh issue close "$num" --comment "Green again in $RUN_URL ($EVENT, ${SHA:0:7})."
                  echo "$gate: success -> closed #$num"
                else
                  echo "$gate: success, no open issue"
                fi ;;
              *) echo "$gate: $result -> no change" ;;
            esac
          done
